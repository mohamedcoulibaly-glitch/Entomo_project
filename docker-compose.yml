services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-entomo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entomo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-entomo}
    volumes:
      - entomo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-entomo} -d ${POSTGRES_DB:-entomo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-entomo}:${POSTGRES_PASSWORD:-entomo_secret}@db:5432/${POSTGRES_DB:-entomo}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-rules}
      DISABLE_REPORT_SCHEDULER: ${DISABLE_REPORT_SCHEDULER:-0}
    expose:
      - "8000"
    volumes:
      - entomo_uploads:/app/uploads
      - entomo_models:/app/models_registry
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  entomo_pgdata:
  entomo_uploads:
  entomo_models:
