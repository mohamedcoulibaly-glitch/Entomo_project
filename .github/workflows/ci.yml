name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security audit
        run: python scripts/security_audit.py

      - name: Run backend tests
        env:
          TESTING: "True"
          DATABASE_URL: sqlite:///./ci_test.db
        run: pytest -q --tb=short

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (for optional E2E job deps)
        run: pip install pytest playwright

      - name: Run frontend unit tests
        run: pytest -q --ignore=tests/test_frontend_e2e.py --ignore=tests/test_sync_e2e.py --ignore=tests/test_capture_media_e2e.py --ignore=tests/test_phase5_critical_flows.py --tb=short

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend-unit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r ../backend/requirements.txt

      - name: Install frontend test dependencies
        run: pip install pytest playwright && playwright install chromium --with-deps

      - name: Run Playwright E2E suite
        run: pytest tests/test_phase5_critical_flows.py tests/test_sync_e2e.py tests/test_capture_media_e2e.py -q --tb=short
