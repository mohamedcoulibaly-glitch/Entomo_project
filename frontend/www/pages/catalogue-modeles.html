<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Catalogue des Modèles Déployés</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tailwind.min.css" />
    <link rel="stylesheet" href="../css/design-tokens.css?v=20260903" />
<style type="text/tailwindcss">
        @layer base {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'OPSZ' 24;
            }
        }
    </style>
    <script src="../js/tailwind-shim.js"></script><script id="tailwind-config">
        window.tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "brand-primary": "#005689",
                        "brand-background": "#F5F5F7",
                        "brand-alert-critical": "#D9534F",
                        "brand-alert-warning": "#F0AD4E",
                        "brand-success": "#078838"
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#111418] dark:text-gray-200">
    <div class="flex h-screen w-full">

        <!-- Sidebar -->
        <div id="shared-sidebar"></div>

        <main class="flex-1 flex flex-col overflow-y-auto">

            <header class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 px-6 sm:px-10 py-3 bg-white dark:bg-background-dark">
                <div class="flex items-center gap-4">
                    <button class="md:hidden flex items-center justify-center rounded-lg h-10 w-10 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300" id="mobile-menu-btn">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] hidden sm:block">Catalogue des Modèles Déployés</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5" id="theme-toggle">
                        <span class="material-symbols-outlined text-xl" id="theme-icon">dark_mode</span>
                    </button>
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5">
                        <span class="material-symbols-outlined text-xl">notifications</span>
                    </button>
                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="Avatar de l'utilisateur" ></div>
                </div>
            </header>

            <div class="flex-1 px-4 sm:px-6 lg:px-10 py-8 overflow-y-auto">
<div class="w-full max-w-7xl mx-auto">
<!-- Page Heading -->
<div class="flex items-center justify-between mb-6">
  <header>
    <p class="text-gray-900 dark:text-white text-3xl font-black leading-tight tracking-tight">Catalogue des Modèles ML</p>
    <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Gérez et déployez vos modèles d'intelligence artificielle.</p>
  </header>
  <div class="flex gap-2">
    <button id="btn-ajouter-modele" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-brand-primary text-white text-sm font-bold hover:bg-brand-primary/90 transition-colors">
      <span class="material-symbols-outlined text-base">add</span>
      Ajouter un modèle
    </button>
    <button id="btn-tester-tous" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 text-sm font-bold hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
      <span class="material-symbols-outlined text-base">science</span>
      Tester tous
    </button>
  </div>
</div>
<!-- Stats rapides -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
  <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4 text-center">
    <p class="text-2xl font-bold text-brand-primary" data-stat="total_models">—</p>
    <p class="text-xs text-gray-500 dark:text-gray-400">Total modèles</p>
  </div>
  <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4 text-center">
    <p class="text-2xl font-bold text-brand-success" data-stat="deployed_models">—</p>
    <p class="text-xs text-gray-500 dark:text-gray-400">Déployés</p>
  </div>
  <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4 text-center">
    <p class="text-2xl font-bold text-brand-alert-warning" data-stat="testing_models">—</p>
    <p class="text-xs text-gray-500 dark:text-gray-400">En test</p>
  </div>
  <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4 text-center">
    <p class="text-2xl font-bold text-gray-500" data-stat="archived_models">—</p>
    <p class="text-xs text-gray-500 dark:text-gray-400">Archivés</p>
  </div>
</div>
<!-- Conteneur de cartes modèles -->
<div data-model-container class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
  <!-- Chargement dynamique par JS -->
  <div class="col-span-full flex justify-center items-center py-12 text-gray-400">
    <span class="material-symbols-outlined text-4xl animate-spin mr-2">refresh</span>
    Chargement des modèles...
  </div>
</div>
<!-- Search and Filters -->
<div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-4">
<!-- SearchBar -->
<div class="w-full md:max-w-md">
<label class="flex flex-col h-12 w-full">
<div class="flex w-full flex-1 items-stretch rounded-lg h-full">
<div class="text-gray-500 dark:text-gray-400 flex border-none bg-white dark:bg-background-dark items-center justify-center pl-4 rounded-l-lg border-r-0">
<span class="material-symbols-outlined">search</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-brand-primary/50 border-gray-300 dark:border-gray-600 bg-white dark:bg-background-dark h-full placeholder:text-gray-500 dark:placeholder:text-gray-400 px-4 rounded-l-none border-l-0 pl-2 text-base font-normal leading-normal" placeholder="Rechercher par nom ou type de modèle..." value=""/>
</div>
</label>
</div>
<!-- Chips -->
<div class="flex gap-3 flex-wrap">
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white dark:bg-background-dark border border-gray-300 dark:border-gray-600 pl-4 pr-2 hover:bg-gray-50 dark:hover:bg-gray-800/50">
<p class="text-gray-700 dark:text-gray-300 text-sm font-medium leading-normal">Statut: Tous</p>
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400">expand_more</span>
</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white dark:bg-background-dark border border-gray-300 dark:border-gray-600 pl-4 pr-2 hover:bg-gray-50 dark:hover:bg-gray-800/50">
<p class="text-gray-700 dark:text-gray-300 text-sm font-medium leading-normal">Type de modèle</p>
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400">expand_more</span>
</button>
</div>
</div>
</div>
</div>
            </div>
        </main>
    </div>

    <!-- Ento-App Scripts -->
    <script src="../js/config-boot.js?v=20260923g"></script>
    <script src="../js/api.js?v=20260923g"></script>
    <script src="../js/permission-guard.js?v=2"></script>
    <script src="../js/sidebar.js?v=1"></script>
    <script src="../js/core.js?v=20260924a"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/pages-generiques.js"></script>
    <script src="../js/catalogue-modeles.js"></script>
    <!-- /Ento-App Scripts -->
</body>
</html>
