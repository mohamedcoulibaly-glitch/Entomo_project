                <div class="flex items-center gap-2">
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5" id="theme-toggle">

                        <span class="material-symbols-outlined text-base">login</span>
                        <span class="hidden sm:inline">Connexion</span>
                    </a>
                    <div id="header-avatar" class="size-10 rounded-full bg-brand-primary text-white flex items-center justify-center text-sm font-bold cursor-pointer hidden" title="Mon profil">?</div>

                    </div>
                    <p class="text-[120px] font-black text-brand-primary leading-none mb-2">404</p>

                    <div class="flex items-center justify-center gap-3">
