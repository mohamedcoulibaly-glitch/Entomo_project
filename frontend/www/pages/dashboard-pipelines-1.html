<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Tableau de Bord - Pipelines ML 1</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tailwind.min.css" />
    <link rel="stylesheet" href="../css/design-tokens.css?v=20260903" />
<style type="text/tailwindcss">
        @layer base {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'OPSZ' 24;
            }
        }
    </style>
    <script src="../js/tailwind-shim.js"></script><script id="tailwind-config">
        window.tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "brand-primary": "#005689",
                        "brand-background": "#F5F5F7",
                        "brand-alert-critical": "#D9534F",
                        "brand-alert-warning": "#F0AD4E",
                        "brand-success": "#078838"
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#111418] dark:text-gray-200">
    <div class="flex h-screen w-full">

        <!-- Sidebar -->
        <div id="shared-sidebar"></div>

        <main class="flex-1 flex flex-col overflow-y-auto">

            <header class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 px-6 sm:px-10 py-3 bg-white dark:bg-background-dark">
                <div class="flex items-center gap-4">
                    <button class="md:hidden flex items-center justify-center rounded-lg h-10 w-10 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300" id="mobile-menu-btn">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] hidden sm:block">Tableau de Bord - Pipelines ML 1</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5" id="theme-toggle">
                        <span class="material-symbols-outlined text-xl" id="theme-icon">dark_mode</span>
                    </button>
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5">
                        <span class="material-symbols-outlined text-xl">notifications</span>
                    </button>
                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="Avatar de l'utilisateur" ></div>
                </div>
            </header>

            <div class="flex-1 px-4 sm:px-6 lg:px-10 py-8 overflow-y-auto">
<div class="max-w-7xl mx-auto">
<!-- PageHeading -->
<div class="flex flex-wrap justify-between gap-4 items-center mb-8">
<div class="flex flex-col gap-2">
<h1 class="text-gray-900 dark:text-white text-3xl md:text-4xl font-black leading-tight tracking-[-0.033em]">Tableau de Bord des Pipelines MLOps</h1>
<p class="text-gray-500 dark:text-[#9dabb9] text-base font-normal leading-normal">Supervisez et gérez les pipelines automatisés de réentraînement des modèles.</p>
</div>
<button data-pipeline-create-btn class="flex items-center justify-center gap-2 min-w-[84px] cursor-pointer rounded-lg h-11 px-5 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="material-symbols-outlined">add</span>
<span class="truncate">Nouveau Pipeline</span>
</button>
</div>
<!-- Stats -->
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6 mb-8">
<div class="flex flex-col gap-2 rounded-lg p-6 bg-white dark:bg-[#1C2127] border border-gray-200 dark:border-[#3b4754]">
<p class="text-gray-500 dark:text-[#9dabb9] text-base font-medium leading-normal">Total Pipelines</p>
<p data-stat="total" class="text-gray-900 dark:text-white tracking-tight text-3xl font-bold leading-tight">0</p>
</div>
<div class="flex flex-col gap-2 rounded-lg p-6 bg-white dark:bg-[#1C2127] border border-gray-200 dark:border-[#3b4754]">
<p class="text-gray-500 dark:text-[#9dabb9] text-base font-medium leading-normal">En cours</p>
<p data-stat="running" class="text-gray-900 dark:text-white tracking-tight text-3xl font-bold leading-tight">0</p>
</div>
<div class="flex flex-col gap-2 rounded-lg p-6 bg-white dark:bg-[#1C2127] border border-gray-200 dark:border-[#3b4754]">
<p class="text-gray-500 dark:text-[#9dabb9] text-base font-medium leading-normal">Terminés</p>
<p data-stat="completed" class="text-gray-900 dark:text-white tracking-tight text-3xl font-bold leading-tight">0</p>
</div>
<div class="flex flex-col gap-2 rounded-lg p-6 bg-white dark:bg-[#1C2127] border border-gray-200 dark:border-[#3b4754]">
<p class="text-gray-500 dark:text-[#9dabb9] text-base font-medium leading-normal">Échecs</p>
<p data-stat="failed" class="text-red-500 dark:text-red-400 tracking-tight text-3xl font-bold leading-tight">0</p>
</div>
</div>
<!-- Tabs & Table Section -->
<div class="bg-white dark:bg-[#1C2127] rounded-lg border border-gray-200 dark:border-[#3b4754]">
<!-- Tabs -->
<div class="pb-3 px-4">
<div class="flex border-b border-gray-200 dark:border-[#3b4754] gap-8">
<button type="button" data-pipeline-filter="all" class="flex flex-col items-center justify-center border-b-[3px] border-b-primary text-primary pb-[13px] pt-4">
<p class="text-sm font-bold leading-normal tracking-[0.015em]">Tous les pipelines</p>
</button>
<button type="button" data-pipeline-filter="scheduled" class="flex flex-col items-center justify-center border-b-[3px] border-b-transparent text-gray-500 dark:text-[#9dabb9] pb-[13px] pt-4 hover:text-primary dark:hover:text-white">
<p class="text-sm font-bold leading-normal tracking-[0.015em]">Planifiés</p>
</button>
<button type="button" data-pipeline-filter="history" class="flex flex-col items-center justify-center border-b-[3px] border-b-transparent text-gray-500 dark:text-[#9dabb9] pb-[13px] pt-4 hover:text-primary dark:hover:text-white">
<p class="text-sm font-bold leading-normal tracking-[0.015em]">Historique</p>
</button>
</div>
</div>
<!-- Table -->
<div class="px-4 py-3 @container">
<div class="flex overflow-hidden">
<table class="w-full text-left">
<thead class="border-b border-gray-200 dark:border-gray-700">
<tr>
<th class="px-4 py-3 text-gray-600 dark:text-white w-2/6 text-sm font-medium leading-normal">Nom du pipeline</th>
<th class="px-4 py-3 text-gray-600 dark:text-white text-sm font-medium leading-normal">Statut</th>
<th class="px-4 py-3 text-gray-600 dark:text-white text-sm font-medium leading-normal">Dernière exécution</th>
<th class="px-4 py-3 text-gray-600 dark:text-white text-sm font-medium leading-normal">Modèle Prod.</th>
<th class="px-4 py-3 text-gray-600 dark:text-white text-sm font-medium leading-normal">Précision</th>
<th class="px-4 py-3 text-gray-600 dark:text-white text-sm font-medium leading-normal">Score F1</th>
<th class="px-4 py-3 text-gray-600 dark:text-white text-sm font-medium leading-normal text-right">Actions</th>
</tr>
</thead>
<tbody>
</tbody>
</table>
</div>
</div>
</div>
</div>
            </div>
        </main>
    </div>

    <!-- Ento-App Scripts -->
    <script src="../js/config-boot.js"></script>
    <script src="../js/api.js?v=20260922e"></script>
    <script src="../js/permission-guard.js?v=2"></script>
    <script src="../js/sidebar.js?v=1"></script>
    <script src="../js/core.js?v=20260922h"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/pages-generiques.js"></script>
    <script src="../js/dashboard-pipelines-1.js"></script>
    <!-- /Ento-App Scripts -->
</body>
</html>
