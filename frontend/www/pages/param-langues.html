<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Paramètres Linguistiques</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />

    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />

<style type="text/tailwindcss">
        @layer base {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'OPSZ' 24;
            }
        }
    </style>
    <script src="../js/tailwind-shim.js"></script><script id="tailwind-config">
        window.tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "brand-primary": "#005689",
                        "brand-background": "#F5F5F7",
                        "brand-alert-critical": "#D9534F",
                        "brand-alert-warning": "#F0AD4E",
                        "brand-success": "#078838"
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#111418] dark:text-gray-200">
    <div class="flex h-screen w-full">

        <!-- Sidebar -->
        <div id="shared-sidebar"></div>

        <main class="flex-1 flex flex-col overflow-y-auto">

            <header class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 px-6 sm:px-10 py-3 bg-white dark:bg-background-dark">
                <div class="flex items-center gap-4">
                    <button class="md:hidden flex items-center justify-center rounded-lg h-10 w-10 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300" id="mobile-menu-btn">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] hidden sm:block">Paramètres Linguistiques</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5" id="theme-toggle">
                        <span class="material-symbols-outlined text-xl" id="theme-icon">dark_mode</span>
                    </button>
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5">
                        <span class="material-symbols-outlined text-xl">notifications</span>
                    </button>
                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="Avatar de l'utilisateur" ></div>
                </div>
            </header>

            <div class="flex-1 px-4 sm:px-6 lg:px-10 py-8 overflow-y-auto">
<!-- PageHeading -->
<div class="flex flex-wrap justify-between gap-3 p-4">
<p class="text-gray-900 dark:text-white text-4xl font-black leading-tight tracking-[-0.033em] min-w-72">Gestion des Langues</p>
</div>
<!-- SegmentedButtons -->
<div class="flex px-4 py-3">
<div class="flex h-10 flex-1 items-center justify-center rounded-lg bg-gray-200/80 dark:bg-gray-800 p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-gray-700 has-[:checked]:shadow-sm has-[:checked]:text-gray-900 dark:has-[:checked]:text-white text-gray-500 dark:text-gray-400 text-sm font-medium leading-normal">
<span class="truncate">Vue Utilisateur</span>
<input class="invisible w-0" name="view-toggle" type="radio" value="Vue Utilisateur"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-gray-700 has-[:checked]:shadow-sm has-[:checked]:text-gray-900 dark:has-[:checked]:text-white text-gray-500 dark:text-gray-400 text-sm font-medium leading-normal">
<span class="truncate">Vue Administrateur</span>
<input checked="" class="invisible w-0" name="view-toggle" type="radio" value="Vue Administrateur"/>
</label>
</div>
</div>
<!-- Admin View Section -->
<div class="flex flex-col gap-4">
<!-- SectionHeader -->
<h2 class="text-gray-900 dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">Administration des Langues</h2>
<div class="flex flex-col sm:flex-row gap-4 items-center justify-between px-4 py-3">
<!-- SearchBar -->
<div class="w-full sm:w-auto sm:flex-1">
<label class="flex flex-col min-w-40 h-12 w-full">
<div class="flex w-full flex-1 items-stretch rounded-lg h-full">
<div class="text-gray-500 dark:text-gray-400 flex border-none bg-gray-200/80 dark:bg-gray-800 items-center justify-center pl-4 rounded-l-lg border-r-0"><span class="material-symbols-outlined">search</span></div>
<input id="lang-search" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-none bg-gray-200/80 dark:bg-gray-800 h-full placeholder:text-gray-500 dark:placeholder:text-gray-400 px-4 rounded-l-none border-l-0 pl-2 text-base font-normal leading-normal" placeholder="Rechercher par nom ou code..." value=""/>
</div>
</label>
</div>
<!-- Primary Button -->
<button id="btn-add-language" type="button" class="flex w-full sm:w-auto cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 bg-primary text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] px-6">
<span class="material-symbols-outlined">add</span>
<span>Ajouter une langue</span>
</button>
</div>
<!-- Admin Data Table -->
<div class="px-4 py-3">
<div class="overflow-x-auto bg-white dark:bg-gray-800/50 rounded-xl shadow-sm">
<table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
<thead class="text-xs text-gray-700 dark:text-gray-300 uppercase bg-gray-100/50 dark:bg-gray-700/50">
<tr>
<th class="px-6 py-3" scope="col">Langue</th>
<th class="px-6 py-3" scope="col">Code ISO</th>
<th class="px-6 py-3" scope="col">Statut</th>
<th class="px-6 py-3" scope="col">Progression</th>
<th class="px-6 py-3 text-right" scope="col">Actions</th>
</tr>
</thead>
<tbody id="languages-table-body">
<tr class="border-b dark:border-gray-700">
<th class="px-6 py-4 font-medium text-gray-900 dark:text-white whitespace-nowrap" scope="row">Français</th>
<td class="px-6 py-4">fr</td>
<td class="px-6 py-4"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300">Actif</span></td>
<td class="px-6 py-4">
<div class="flex items-center gap-2">
<div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5"><div class="bg-primary h-2.5 rounded-full" style="width: 100%"></div></div>
<span class="font-medium text-gray-700 dark:text-gray-300">100%</span>
</div>
</td>
<td class="px-6 py-4 text-right space-x-2">
<button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300"><span class="material-symbols-outlined">visibility</span></button>
<button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300"><span class="material-symbols-outlined">edit</span></button>
<button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300"><span class="material-symbols-outlined">toggle_on</span></button>
</td>
</tr>
<tr class="border-b dark:border-gray-700">
<th class="px-6 py-4 font-medium text-gray-900 dark:text-white whitespace-nowrap" scope="row">Wolof</th>
<td class="px-6 py-4">wo</td>
<td class="px-6 py-4"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300">Actif</span></td>
<td class="px-6 py-4">
<div class="flex items-center gap-2">
<div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5"><div class="bg-yellow-400 h-2.5 rounded-full" style="width: 85%"></div></div>
<span class="font-medium text-gray-700 dark:text-gray-300">85%</span>
</div>
</td>
<td class="px-6 py-4 text-right space-x-2">
<button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300"><span class="material-symbols-outlined">visibility</span></button>
<button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300"><span class="material-symbols-outlined">edit</span></button>
<button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300"><span class="material-symbols-outlined">toggle_on</span></button>
</td>
</tr>
<tr class="border-b dark:border-gray-700">
<th class="px-6 py-4 font-medium text-gray-900 dark:text-white whitespace-nowrap" scope="row">Sérère</th>
<td class="px-6 py-4">srr</td>
<td class="px-6 py-4"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-200 text-gray-800 dark:bg-gray-600 dark:text-gray-200">Inactif</span></td>
<td class="px-6 py-4">
<div class="flex items-center gap-2">
<div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5"><div class="bg-yellow-400 h-2.5 rounded-full" style="width: 40%"></div></div>
<span class="font-medium text-gray-700 dark:text-gray-300">40%</span>
</div>
</td>
<td class="px-6 py-4 text-right space-x-2">
<button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300"><span class="material-symbols-outlined">visibility</span></button>
<button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300"><span class="material-symbols-outlined">edit</span></button>
<button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300"><span class="material-symbols-outlined">toggle_off</span></button>
</td>
</tr>
<tr>
<th class="px-6 py-4 font-medium text-gray-900 dark:text-white whitespace-nowrap" scope="row">English</th>
<td class="px-6 py-4">en</td>
<td class="px-6 py-4"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-200 text-gray-800 dark:bg-gray-600 dark:text-gray-200">Inactif</span></td>
<td class="px-6 py-4">
<div class="flex items-center gap-2">
<div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5"><div class="bg-red-500 h-2.5 rounded-full" style="width: 15%"></div></div>
<span class="font-medium text-gray-700 dark:text-gray-300">15%</span>
</div>
</td>
<td class="px-6 py-4 text-right space-x-2">
<button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300"><span class="material-symbols-outlined">visibility</span></button>
<button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300"><span class="material-symbols-outlined">edit</span></button>
<button class="p-2 rounded-lg hover:bg-red-100/50 dark:hover:bg-red-900/50 text-red-500"><span class="material-symbols-outlined">delete</span></button>
</td>
</tr>
</tbody>
</table>
</div>
</div>
</div>
            </div>
        </main>
    </div>

    <!-- /Ento-App Scripts -->
</body>
