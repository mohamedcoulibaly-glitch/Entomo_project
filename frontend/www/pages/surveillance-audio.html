<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Surveillance des Modèles Audio</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../css/tailwind.min.css" />

<style type="text/tailwindcss">
        @layer base {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'OPSZ' 24;
            }
        }
    </style>
    <script src="../js/tailwind-shim.js"></script><script id="tailwind-config">
        window.tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {

                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },

<body class="font-display bg-background-light dark:bg-background-dark text-[#111418] dark:text-gray-200">
    <div class="flex h-screen w-full">

        <!-- Sidebar -->
        <div id="shared-sidebar"></div>

        <main class="flex-1 flex flex-col overflow-y-auto">

            <header class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 px-6 sm:px-10 py-3 bg-white dark:bg-background-dark">
                <div class="flex items-center gap-4">
                    <button class="md:hidden flex items-center justify-center rounded-lg h-10 w-10 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300" id="mobile-menu-btn">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] hidden sm:block">Surveillance des Modèles Audio</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5" id="theme-toggle">
                        <span class="material-symbols-outlined text-xl" id="theme-icon">dark_mode</span>
                    </button>
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5">
                        <span class="material-symbols-outlined text-xl">notifications</span>
                    </button>
                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="Avatar de l'utilisateur" ></div>
                </div>
            </header>

            <div class="flex-1 px-4 sm:px-6 lg:px-10 py-8 overflow-y-auto">
<div class="mx-auto max-w-7xl">
<!-- PageHeading -->
<header class="flex flex-wrap justify-between gap-4 items-center mb-6">
<div class="flex flex-col gap-2">
<h1 class="text-gray-900 dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">Tableau de Bord - Identification Audio</h1>
<p class="text-gray-500 dark:text-[#9dabb9] text-base font-normal leading-normal">Surveillance des performances des modèles de détection et classification</p>
</div>
<div class="flex flex-wrap gap-2" data-audio-export-actions>
<button type="button" data-export="csv" class="flex h-10 items-center gap-2 rounded-lg bg-white dark:bg-[#283039] px-3 border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50 text-sm font-medium">
<span class="material-symbols-outlined text-base">download</span>Exporter CSV
</button>
<button type="button" data-export="json" class="flex h-10 items-center gap-2 rounded-lg bg-brand-primary text-white px-3 hover:bg-brand-primary/90 text-sm font-medium">
<span class="material-symbols-outlined text-base">data_object</span>Exporter JSON
</button>
</div>
</header>
<!-- Chips -->
<div class="flex flex-wrap gap-3 mb-8">
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white dark:bg-[#283039] px-3 border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50">
<span class="material-symbols-outlined text-gray-600 dark:text-white text-xl">calendar_month</span>
<p class="text-gray-700 dark:text-white text-sm font-medium leading-normal">Période: 30 derniers jours</p>
<span class="material-symbols-outlined text-gray-600 dark:text-white text-xl">expand_more</span>
</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white dark:bg-[#283039] px-3 border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50">
<span class="material-symbols-outlined text-gray-600 dark:text-white text-xl">location_on</span>
<p class="text-gray-700 dark:text-white text-sm font-medium leading-normal">Localisation: Toutes</p>
<span class="material-symbols-outlined text-gray-600 dark:text-white text-xl">expand_more</span>
</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white dark:bg-[#283039] px-3 border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50">
<span class="material-symbols-outlined text-gray-600 dark:text-white text-xl">bug_report</span>
<p class="text-gray-700 dark:text-white text-sm font-medium leading-normal">Espèce cible: Toutes</p>
<span class="material-symbols-outlined text-gray-600 dark:text-white text-xl">expand_more</span>
</button>
</div>
<!-- Section 1: Vue d'Ensemble des Performances -->
<section class="mb-10">
<h2 class="text-gray-900 dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] mb-4">Performance Globale des Modèles Audio</h2>
<!-- Stats -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
<div class="flex flex-col gap-2 rounded-xl p-6 bg-white dark:bg-[#1A242E] border border-gray-200 dark:border-[#3b4754]">
<p class="text-gray-600 dark:text-white text-base font-medium leading-normal">Précision Globale</p>
<p class="text-gray-900 dark:text-white tracking-light text-3xl font-bold leading-tight" data-stat="precision">—</p>
</div>
<div class="flex flex-col gap-2 rounded-xl p-6 bg-white dark:bg-[#1A242E] border border-gray-200 dark:border-[#3b4754]">
<p class="text-gray-600 dark:text-white text-base font-medium leading-normal">Taux de Détection</p>
<p class="text-gray-900 dark:text-white tracking-light text-3xl font-bold leading-tight" data-stat="detection">—</p>
</div>
<div class="flex flex-col gap-2 rounded-xl p-6 bg-white dark:bg-[#1A242E] border border-gray-200 dark:border-[#3b4754]">
<p class="text-gray-600 dark:text-white text-base font-medium leading-normal">Échantillons Analysés</p>
<p class="text-gray-900 dark:text-white tracking-light text-3xl font-bold leading-tight" data-stat="echantillons">—</p>
</div>
</div>
</section>
<!-- Section 2: Captures Audio Dynamiques -->
<section>
<h2 class="text-gray-900 dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] mb-4">Captures Audio</h2>
<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" data-audio-container>
</div>
</section>
</div>
            </div>
        </main>
