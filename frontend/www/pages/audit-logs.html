<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Journaux d'Audit - Ento-App Afrique</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tailwind.min.css" />
    <link rel="stylesheet" href="../css/design-tokens.css?v=3" />
<style type="text/tailwindcss">
        @layer base {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'OPSZ' 24;
            }
        }
    </style>
    <script src="../js/tailwind-shim.js"></script><script id="tailwind-config">
        window.tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "brand-primary": "#005689",
                        "brand-background": "#F5F5F7",
                        "brand-alert-critical": "#D9534F",
                        "brand-alert-warning": "#F0AD4E",
                        "brand-success": "#078838"
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#111418] dark:text-gray-200">
    <div class="flex h-screen w-full">

        <!-- Sidebar -->
        <div id="shared-sidebar"></div>

        <main class="flex-1 flex flex-col overflow-y-auto">

            <header class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 px-6 sm:px-10 py-3 bg-white dark:bg-background-dark">
                <div class="flex items-center gap-4">
                    <button class="md:hidden flex items-center justify-center rounded-lg h-10 w-10 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300" id="mobile-menu-btn">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] hidden sm:block">Journaux d'Audit</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5" id="theme-toggle">
                        <span class="material-symbols-outlined text-xl" id="theme-icon">dark_mode</span>
                    </button>
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5">
                        <span class="material-symbols-outlined text-xl">notifications</span>
                    </button>
                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="Avatar de l'utilisateur" ></div>
                </div>
            </header>

            <div class="flex-1 px-4 sm:px-6 lg:px-10 py-8 overflow-y-auto">

                <div class="flex flex-wrap justify-between gap-4 items-center mb-6">
                    <div class="flex min-w-72 flex-col gap-2">
                        <p class="text-[#111418] dark:text-white text-3xl font-black leading-tight tracking-[-0.033em]">Journaux d'Audit</p>
                        <p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal">Historique complet des actions système (Accès administrateur).</p>
                    </div>
                    <button class="flex h-10 cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-lg bg-brand-primary px-4 text-sm font-bold leading-normal text-white" id="btn-exporter-csv">
                        <span class="material-symbols-outlined text-lg">file_download</span> Exporter CSV
                    </button>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                            <label class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1 block">Utilisateur</label>
                            <select class="w-full h-9 rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm text-[#111418] dark:text-gray-200 focus:ring-brand-primary focus:border-brand-primary" id="filter-user">
                                <option>Tous</option>
                                <option>Dr. Mamadou Diallo</option>
                                <option>Dr. Fatou Sall</option>
                                <option>Admin PNLP</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1 block">Module</label>
                            <select class="w-full h-9 rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm text-[#111418] dark:text-gray-200 focus:ring-brand-primary focus:border-brand-primary" id="filter-module">
                                <option>Tous</option>
                                <option>Captures</option>
                                <option>Sites</option>
                                <option>Utilisateurs</option>
                                <option>Interventions</option>
                                <option>Campagnes</option>
                                <option>Synchronisation</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1 block">Action</label>
                            <select class="w-full h-9 rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm text-[#111418] dark:text-gray-200 focus:ring-brand-primary focus:border-brand-primary" id="filter-action">
                                <option>Toutes</option>
                                <option>Création</option>
                                <option>Modification</option>
                                <option>Suppression</option>
                                <option>Validation</option>
                                <option>Connexion</option>
                                <option>Export</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1 block">Période</label>
                            <input type="date" class="w-full h-9 rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm text-[#111418] dark:text-gray-200 focus:ring-brand-primary focus:border-brand-primary" id="filter-date-debut" />
                        </div>
                    </div>
                    <div class="flex justify-end mt-3">
                        <button class="flex h-9 cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-lg bg-brand-primary px-4 text-sm font-bold leading-normal text-white" id="btn-filtrer">
                            <span class="material-symbols-outlined text-base">filter_alt</span> Filtrer
                        </button>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="bg-brand-background dark:bg-gray-700 text-xs text-gray-500 dark:text-gray-400 uppercase">
                                    <th class="text-left p-3 font-semibold">Utilisateur</th>
                                    <th class="text-left p-3 font-semibold">Action</th>
                                    <th class="text-left p-3 font-semibold">Module</th>
                                    <th class="text-left p-3 font-semibold">Ressource</th>
                                    <th class="text-left p-3 font-semibold">IP</th>
                                    <th class="text-left p-3 font-semibold">Date</th>
                                    <th class="text-center p-3 font-semibold">Détails</th>
                                </tr>
                            </thead>
                            <tbody id="logs-body">
                            </tbody>
                        </table>
                    </div>
                    <div class="flex items-center justify-between p-3 border-t border-gray-200 dark:border-gray-700 text-sm" id="pagination-controls">
                        <p class="text-gray-500 dark:text-gray-400" id="pagination-info">Chargement...</p>
                        <div class="flex items-center gap-2" id="pagination-buttons"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Ento-App Scripts -->
    <script src="../js/config-boot.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/sidebar.js?v=1"></script>
    <script src="../js/core.js?v=7"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/pages-generiques.js"></script>
    <script src="../js/audit-logs.js"></script>
    <!-- /Ento-App Scripts -->
</body>
</html>
