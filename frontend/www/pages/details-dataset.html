<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail du dataset — Ento-App Afrique</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tailwind.min.css" />
    <link rel="stylesheet" href="../css/design-tokens.css" /><script>tailwind.config={darkMode:'class',theme:{extend:{colors:{'brand-primary':'#005689'}}}}</script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
  <header class="border-b bg-white dark:border-gray-800 dark:bg-gray-900">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
      <a href="../index.html" class="flex items-center gap-2 font-bold text-brand-primary">
        <span class="material-symbols-outlined">biotech</span> Ento-App Afrique
      </a>
      <div class="flex gap-2">
        <button id="theme-toggle" class="rounded-lg border px-3 py-2 dark:border-gray-700" aria-label="Changer de thème"><span id="theme-icon" class="material-symbols-outlined">dark_mode</span></button>
        <a href="gestion-datasets.html" class="rounded-lg bg-brand-primary px-4 py-2 text-sm font-semibold text-white">Retour aux datasets</a>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-6xl space-y-6 px-5 py-8">
    <nav class="text-sm text-gray-500"><a href="gestion-datasets.html" class="hover:underline">Datasets</a> / <span data-field="nom">Chargement…</span></nav>
    <section class="rounded-2xl border bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <p class="mb-1 text-xs font-semibold uppercase tracking-wide text-brand-primary">Fiche dataset</p>
          <h1 data-field="nom" class="text-3xl font-bold">Chargement…</h1>
          <p data-field="description" class="mt-2 max-w-3xl text-gray-500">—</p>
        </div>
        <span data-field="statut" class="rounded-full bg-blue-100 px-3 py-1 text-sm font-semibold text-blue-700">—</span>
      </div>
      <dl class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <div class="rounded-xl bg-gray-50 p-4 dark:bg-gray-800"><dt class="text-xs text-gray-500">Version</dt><dd data-field="version" class="mt-1 font-semibold">—</dd></div>
        <div class="rounded-xl bg-gray-50 p-4 dark:bg-gray-800"><dt class="text-xs text-gray-500">Type</dt><dd data-field="type" class="mt-1 font-semibold">—</dd></div>
        <div class="rounded-xl bg-gray-50 p-4 dark:bg-gray-800"><dt class="text-xs text-gray-500">Images</dt><dd data-field="images_count" class="mt-1 font-semibold">0</dd></div>
        <div class="rounded-xl bg-gray-50 p-4 dark:bg-gray-800"><dt class="text-xs text-gray-500">Source</dt><dd data-field="source_annotations" class="mt-1 font-semibold">—</dd></div>
      </dl>
    </section>
    <section class="rounded-2xl border bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900">
      <div class="mb-4 flex items-center justify-between"><h2 class="text-xl font-bold">Annotations</h2><span id="annotation-count" class="text-sm text-gray-500">0 élément</span></div>
      <div id="annotations-list" class="divide-y dark:divide-gray-800"><p class="py-6 text-center text-gray-400">Chargement…</p></div>
    </section>
    <section id="dataset-error" class="hidden rounded-xl border border-red-200 bg-red-50 p-5 text-red-700"></section>
  </main>

    <!-- Ento-App Scripts -->
    <script src="../js/config-boot.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/pages-generiques.js"></script>
    <script src="../js/details-dataset.js"></script>
    <!-- /Ento-App Scripts -->
</body>
</html>
