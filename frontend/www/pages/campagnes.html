<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Gestion des Campagnes - Ento-App Afrique</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tailwind.min.css" />
    <link rel="stylesheet" href="../css/design-tokens.css?v=20260903" />
<style type="text/tailwindcss">
        @layer base {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'OPSZ' 24;
            }
        }
    </style>
    <script src="../js/tailwind-shim.js"></script><script id="tailwind-config">
        window.tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "brand-primary": "#005689",
                        "brand-background": "#F5F5F7",
                        "brand-alert-critical": "#D9534F",
                        "brand-alert-warning": "#F0AD4E",
                        "brand-success": "#078838"
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#111418] dark:text-gray-200">
    <div class="flex h-screen w-full">

        <!-- Sidebar -->
        <div id="shared-sidebar"></div>

        <main class="flex-1 flex flex-col overflow-y-auto">

            <header class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 px-6 sm:px-10 py-3 bg-white dark:bg-background-dark">
                <div class="flex items-center gap-4">
                    <button class="md:hidden flex items-center justify-center rounded-lg h-10 w-10 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300" id="mobile-menu-btn">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] hidden sm:block">Gestion des Campagnes</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5" id="theme-toggle">
                        <span class="material-symbols-outlined text-xl" id="theme-icon">dark_mode</span>
                    </button>
                    <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] dark:bg-gray-700 text-[#111418] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5">
                        <span class="material-symbols-outlined text-xl">notifications</span>
                    </button>
                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="Avatar de l'utilisateur" ></div>
                </div>
            </header>

            <div class="flex-1 px-4 sm:px-6 lg:px-10 py-8 overflow-y-auto">

                <div class="flex flex-wrap justify-between gap-4 items-center mb-6">
                    <div class="flex min-w-72 flex-col gap-2">
                        <p class="text-[#111418] dark:text-white text-3xl font-black leading-tight tracking-[-0.033em]">Campagnes</p>
                        <p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal">Planification et suivi des campagnes entomologiques.</p>
                    </div>
                    <button type="button" class="flex h-10 cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-lg bg-brand-primary px-4 text-sm font-bold leading-normal text-white" id="btn-nouvelle-campagne">
                        <span class="material-symbols-outlined text-lg">add_circle</span> Nouvelle campagne
                    </button>
                </div>

                <div class="flex gap-3 py-3 border-b border-gray-200 dark:border-gray-700 mb-6 flex-wrap">
                    <button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-brand-primary text-white pl-4 pr-3" id="filter-toutes-campagnes">
                        <p class="text-sm font-medium leading-normal">Toutes</p>
                    </button>
                    <button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-brand-background dark:bg-gray-700 pl-4 pr-3 text-[#111418] dark:text-gray-200" id="filter-planifiees">
                        <p class="text-sm font-medium leading-normal">Planifiées</p>
                        <span class="text-xs font-semibold bg-brand-alert-warning/10 text-brand-alert-warning px-1.5 py-0.5 rounded-full" id="count-planifiees">0</span>
                    </button>
                    <button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-brand-background dark:bg-gray-700 pl-4 pr-3 text-[#111418] dark:text-gray-200" id="filter-en-cours">
                        <p class="text-sm font-medium leading-normal">En cours</p>
                        <span class="text-xs font-semibold bg-brand-primary/10 text-brand-primary px-1.5 py-0.5 rounded-full" id="count-en-cours">0</span>
                    </button>
                    <button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-brand-background dark:bg-gray-700 pl-4 pr-3 text-[#111418] dark:text-gray-200" id="filter-terminees">
                        <p class="text-sm font-medium leading-normal">Terminées</p>
                        <span class="text-xs font-semibold bg-brand-success/10 text-brand-success px-1.5 py-0.5 rounded-full" id="count-terminees">0</span>
                    </button>
                </div>

                <div id="campagnes-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
                    <div class="col-span-full text-center py-10 text-gray-400">Chargement…</div>
                </div>

            </div>
        </main>
    </div>

    <!-- Ento-App Scripts -->
    <script src="../js/config-boot.js?v=20260923g"></script>
    <script src="../js/api.js?v=20260923g"></script>
    <script src="../js/permission-guard.js?v=2"></script>
    <script src="../js/sidebar.js?v=1"></script>
    <script src="../js/core.js?v=20260924a"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/pages-generiques.js?v=7"></script>
    <script src="../js/campagnes.js?v=20260924c"></script>
    <!-- /Ento-App Scripts -->
</body>
</html>
