                </div>
                <h1 class="text-2xl font-bold text-[#111418] dark:text-white">Ento-App Afrique</h1>
            </div>
            <p class="text-gray-500 text-sm">Plateforme de surveillance entomologique</p>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl border border-gray-200 dark:border-gray-700 p-8">
            <h2 class="text-xl font-bold text-[#111418] dark:text-white mb-6">Connexion</h2>

            <div id="login-error" class="hidden mb-4 p-3 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm flex items-center gap-2">
                <span class="material-symbols-outlined text-base">error</span>
                <span id="login-error-msg">Identifiants incorrects.</span>
            </div>

            <form id="login-form" class="space-y-5" autocomplete="on">
                <div>
                    <label for="login-username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Nom d'utilisateur</label>
                    <input id="login-username" type="text" autocomplete="username" placeholder="Nom d'utilisateur"
                        class="w-full h-11 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm px-3.5 focus:outline-none focus:ring-2 focus:ring-brand-primary focus:border-transparent text-[#111418] dark:text-white placeholder-gray-400"/>
                </div>
                <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Mot de passe</label>
                    <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••"
                        class="w-full h-11 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm px-3.5 focus:outline-none focus:ring-2 focus:ring-brand-primary focus:border-transparent text-[#111418] dark:text-white placeholder-gray-400"/>
                </div>
                <button id="login-btn" type="submit"
                    class="w-full h-11 bg-brand-primary hover:bg-brand-primary/90 text-white font-bold rounded-lg transition-colors flex items-center justify-center gap-2 text-sm">
                    <span class="material-symbols-outlined text-base">login</span>
                    Se connecter
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-xs text-gray-500">Plateforme de surveillance entomologique — accès réservé</p>
                <p class="mt-2 text-xs text-gray-400">Démonstration : <strong>admin</strong> / <strong>Admin@2024</strong></p>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-brand-primary hover:underline flex items-center justify-center gap-1">
                <span class="material-symbols-outlined text-base">arrow_back</span>
                Retour à l'accueil
            </a>
        </div>
    </div>
    
    <!-- Ento-App Scripts -->
    <script src="js/config-boot.js"></script>
    <script src="js/api.js"></script>
    <script src="js/core.js?v=7"></script>
    <!-- /Ento-App Scripts -->
    <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      const errMsg = document.getElementById('login-error-msg');
      errEl.classList.add('hidden');
      buttonLoading(btn, true);
      try {
        const u = document.getElementById('login-username').value.trim();
        const p = document.getElementById('login-password').value;
        if (!u || !p) { errMsg.textContent = 'Veuillez remplir tous les champs.'; errEl.classList.remove('hidden'); buttonLoading(btn, false); return; }
        const res = await apiAuth.login(u, p);
        if (res) {
          pushNotification('Connecté avec succès !', 'success');
          const redirect = sessionStorage.getItem('redirect_after_login') || 'index.html';
          sessionStorage.removeItem('redirect_after_login');
          setTimeout(() => { window.location.href = redirect; }, 600);
        } else {
          errMsg.textContent = 'Nom d\'utilisateur ou mot de passe incorrect.';
          errEl.classList.remove('hidden');
          buttonLoading(btn, false);
        }
      } catch (err) {
        errMsg.textContent = err.message || 'Erreur de connexion au serveur.';
        errEl.classList.remove('hidden');
        buttonLoading(btn, false);
      }
    });
    </script>
